services:
  insights-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cce-insights-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST:-cce-clickhouse}
      DB_PORT: ${DB_PORT:-8123}
      DB_NAME: ${DB_NAME:-cce_analytics}
      DB_USERNAME: ${DB_USERNAME:-cce_pipeline}
      DB_PASSWORD: ${DB_PASSWORD:-cce_analytics_dev}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      SERVER_PORT: 8088
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - cce-net

networks:
  cce-net:
    external: true
    name: deploy-scripts_cce-net
